name: elseplane
description: Infinite canvas with first-class support for code and Markdown.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.3.0
  cupertino_icons: ^2.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_markdown_plus_latex: ^1.0.5
  flutter_svg: ^2.3.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  infinite_lazy_grid:
    git:
      url: https://github.com/ruinivist/infinite_lazy_grid.git
      ref: 86d0b2e9b8fa7206c56c94b5a71ffe3171424ce0
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^3.1.21
  markdown: ^7.3.1
  perfect_freehand: ^2.5.2+1
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  scroll_animator: 0.3.0
  shared_preferences: ^2.5.5
  super_clipboard: ^0.9.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.1

dependency_overrides:
  flutter_markdown_plus:
    git:
      url: https://github.com/ruinivist/flutter_markdown_plus.git
      ref: main

dev_dependencies:
  build_runner: ^2.16.1
  flutter_math_fork: ^0.7.4
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  # Used by web tests to register the browser storage implementation.
  shared_preferences_web: ^2.4.3
  url_launcher_platform_interface: ^2.3.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/arrow-dashed.svg
    - assets/icons/arrow-solid.svg
    - assets/icons/resize.svg
    - assets/fonts/jetbrains-mono/OFL.txt
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
