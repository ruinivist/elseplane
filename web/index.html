<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Infinite canvas with first-class support for code and Markdown.">
  <meta name="darkreader-lock">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="elseplane">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>elseplane</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      /* Mirrors Starless Dark canvasBackground and textSecondary in lib/theme/starless.dart. */
      --canvas-background: #16191e;
      --text-secondary: #a3a3a3;
      background: var(--canvas-background);
      color-scheme: dark;
    }

    body {
      margin: 0;
      background: var(--canvas-background);
    }

    #startup-loader {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: var(--canvas-background);
      color: var(--text-secondary);
      font: 14px monospace;
    }

    .loading-dots {
      display: inline-block;
      width: 3ch;
      vertical-align: bottom;
    }

    .loading-dots::before {
      content: "...";
      display: block;
      overflow: hidden;
      width: 1ch;
      animation: loading-dots 1.5s step-end infinite;
    }

    @keyframes loading-dots {
      0%, 100% { width: 1ch; }
      33.333% { width: 2ch; }
      66.667% { width: 3ch; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-dots::before { animation: none; width: 3ch; }
    }

    /* Work around https://github.com/flutter/flutter/issues/184524. */
    flt-text-editing-host { pointer-events: none !important; }
  </style>
</head>
<body>
  <div id="startup-loader" role="status" aria-label="Loading">
    <!-- Inlined from assets/brand/elseplane-logo.svg to show immediately without an extra request. -->
    <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false">
      <g id="logo-artwork">
        <rect x="120" y="120" width="784" height="784" rx="184" fill="#16191E" />
        <path
          fill="none"
          stroke="#B8B8B8"
          stroke-width="42"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M 350,536
             C 466,530 626,476 658,408
             C 684,352 618,310 552,330
             C 432,366 338,480 330,570
             C 318,670 408,726 510,686
             C 628,640 712,518 790,540
             C 858,558 904,606 904,670
             V 720
             C 904,822 822,904 720,904
             H 304
             C 202,904 120,822 120,720
             V 304
             C 120,202 202,120 304,120
             H 720
             C 822,120 904,202 904,304
             V 670"
        />
      </g>
    </svg>
    <span aria-hidden="true">Loading <span class="loading-dots"></span></span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('startup-loader').remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
